# Single source of truth for the apps/projects list.
# Rendered on /about/ (Jekyll) and synced into the profile README
# (../edihasaj/README.md) via `node bin/gen-readme.js`.
#
# Add a new app: append an entry to the right section, then run:
#   node bin/gen-readme.js
# Fields: emoji, name, url, source (optional), desc

