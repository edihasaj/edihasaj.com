<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  {% if page.url == '/' %}<h1 class="site-name">{% else %}<p class="site-name">{% endif %}
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  {% if page.url == '/' %}</h1>{% else %}</p>{% endif %}
  <nav aria-label="Primary">
    <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Writing</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <button class="js-theme-toggle theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" hidden><span aria-hidden="true"></span></button>
  </nav>
</header>
